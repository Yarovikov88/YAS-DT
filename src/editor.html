<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>YAS Core Editor v2.1</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .fact-card:hover { transform: translateY(-2px); transition: all 0.2s; }
    </script>
</head>
<body class="bg-gray-900 text-gray-100 p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
            <h1 class="text-3xl font-bold text-blue-400">YAS Digital Twin | Core Editor</h1>
            <div class="space-x-4">
                <input type="file" id="fileInput" class="hidden" onchange="loadJSON(event)">
                <button onclick="document.getElementById('fileInput').click()" class="bg-blue-600 hover:bg-blue-700 px-4 py-2 rounded">Загрузить JSON</button>
                <button onclick="downloadJSON()" class="bg-green-600 hover:bg-green-700 px-4 py-2 rounded">Сохранить результат</button>
            </div>
        </header>

        <div id="app" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            </div>
    </div>

    <script>
        let coreData = [];

        function loadJSON(event) {
            const file = event.target.files[0];
            const reader = new FileReader();
            reader.onload = function(e) {
                const json = JSON.parse(e.target.result);
                coreData = json.knowledge_base;
                render();
            };
            reader.readAsText(file);
        }

        function render() {
            const container = document.getElementById('app');
            container.innerHTML = coreData.map((fact, index) => `
                <div class="fact-card bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
                    <div class="flex justify-between items-start mb-4">
                        <span class="text-xs font-mono text-gray-500">ID: ${fact.id}</span>
                        <span class="px-2 py-1 bg-gray-700 rounded text-xs text-blue-300">${fact.category}</span>
                    </div>
                    <h3 class="text-lg font-semibold mb-2">${fact.title}</h3>
                    <p class="text-gray-400 text-sm mb-4 h-20 overflow-y-auto">${fact.content}</p>
                    
                    <div class="space-y-4 border-t border-gray-700 pt-4">
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Вес (Weight): ${fact.weight}</label>
                            <input type="range" min="0" max="1" step="0.1" value="${fact.weight}" 
                                   onchange="updateFact(${index}, 'weight', parseFloat(this.value))"
                                   class="w-full h-2 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-blue-500">
                        </div>
                        <div>
                            <label class="block text-xs text-gray-500 mb-1">Возраст (Age)</label>
                            <input type="number" value="${fact.age || ''}" 
                                   onchange="updateFact(${index}, 'age', parseInt(this.value))"
                                   class="bg-gray-700 border border-gray-600 rounded px-2 py-1 w-20 text-sm focus:outline-none focus:border-blue-500">
                        </div>
                    </div>
                </div>
            `).join('');
        }

        function updateFact(index, key, value) {
            coreData[index][key] = value;
            console.log(`Updated ID ${coreData[index].id}: ${key} = ${value}`);
        }

        function downloadJSON() {
            const fullData = { knowledge_base: coreData };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(fullData, null, 2));
            const downloadAnchorNode = document.createElement('a');
            downloadAnchorNode.setAttribute("href", dataStr);
            downloadAnchorNode.setAttribute("download", "yas_core_updated.json");
            document.body.appendChild(downloadAnchorNode);
            downloadAnchorNode.click();
            downloadAnchorNode.remove();
        }
    </script>
</body>
</html>
